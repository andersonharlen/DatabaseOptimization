version: '3.8'

services:
  postgres-optimization:
    image: postgres:15-alpine
    container_name: db_performance_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: performance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: